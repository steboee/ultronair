# Ultronair company config. Human-readable reasoning: docs/roster.md
# kind: orchestrator | worker | code   (code = HQ logic, 0 tokens, shown as grey desk)

models:
  opus:   { id: claude-opus-5-5,   usd_per_mtok: { in: 4, out: 20 } }
  sonnet: { id: claude-sonnet-5-5, usd_per_mtok: { in: 2, out: 10 } }
  haiku:  { id: claude-haiku-4-5,  usd_per_mtok: { in: 1, out: 5 } }   # no effort param

budgets:
  task_usd:  { S: 3, M: 10, L: 25 }   # pause + approval card when reached
  daily_usd: 50

project:
  id: iad-be
  path: ~/Documents/WORK/WEZEO/Projects/iad-backend/iad-be
  base_branch: main
  branch_pattern: "{key}/{slug}"
  rule_sources: [CLAUDE.md, .cursor/rules/backend.mdc, .cursor/rules/wezeo.mdc,
                 .cursor/rules/testing.mdc, .cursor/rules/permissions.mdc, .cursor/rules/review.mdc]
  # rule packs: which .cursor rules each desk gets in its system prompt (`rule_pack:` on the agent).
  # Read from the project checkout, falling back to kit/rules/ (npm run kit:import). CLAUDE.md is loaded by Claude Code itself.
  rule_packs:
    planner:     [.cursor/rules/backend.mdc, .cursor/rules/wezeo.mdc]
    implementer: [.cursor/rules/backend.mdc, .cursor/rules/wezeo.mdc, .cursor/rules/testing.mdc, .cursor/rules/permissions.mdc]
    reviewer:    [.cursor/rules/review.mdc, .cursor/rules/backend.mdc, .cursor/rules/testing.mdc]
    security:    [.cursor/rules/permissions.mdc, .cursor/rules/review.mdc]
    analyst:     [.cursor/rules/wezeo.mdc, .cursor/rules/iad-workflow.mdc]
  protected_write_paths: [plugins/w/, plugins/wapi/, plugins/winsyko/, plugins/wintegration/]
  secret_paths: [.env, .env.ci, auth.json, firebase-credentials.json]
  verify:
    - composer test
    - vendor/bin/pint --dirty --test
    - for s in deploy/checks/{lang,class,yaml,sms}check.php; do php "$s" "$PWD"; done
  known_baseline_failures: ["Cannot redeclare function aCatalogueFund()"]

# Q = a question: someone reads the code and answers; nothing is changed, no worktree, no review.
# Tasks created as "Let HQ decide" go through triage first, which picks Q or S/M/L.
routes:
  Q: [analyst]
  S: [triage, implementer, verify, primary-reviewer, mr-writer]
  M: [triage, pm-lead, approve-spec, tech-lead, implementer, verify, review, mr-writer, approve-mr]
  L: [triage, pm-lead, approve-spec, tech-lead, implementer, verify, review, mr-writer, approve-mr]
  max_fix_rounds: 2

# office: room position and color (used for the board colors and the 3D view on the office-3d branch)
departments:
  hq:          { name: HQ,                           office: { col: 0, row: 0, color: "#ff8a7a" } }
  product:     { name: Product,     lead: pm-lead,   office: { col: 1, row: 0, color: "#6cb4ee" } }
  engineering: { name: Engineering, lead: tech-lead, office: { col: 2, row: 0, color: "#5cc9a7" } }
  qa:          { name: QA,          lead: qa-lead,   office: { col: 0, row: 1, color: "#b39ddb" } }
  release:     { name: Release,                      office: { col: 1, row: 1, color: "#f6c453" } }

agents:
  # ---------- HQ (code) ----------
  - { id: router, name: Hub,      dept: hq,      kind: code, does: "task state machine, worktrees, briefs, budgets, approvals" }
  - { id: reviewer-picker, name: Sorter, dept: qa,  kind: code, does: "path rules -> which specialists run" }
  - { id: verify, name: Checker,      dept: release, kind: code, does: "runs project.verify, parses failures -> verify.json" }
  - { id: release, name: Shipper,     dept: release, kind: code, does: "push + glab MR after approval" }
  - { id: ci-poller, name: Watcher,   dept: release, kind: code, does: "polls pipeline, hands failing log to ci-summarizer" }

  - id: triage
    name: Tia
    dept: hq
    kind: worker
    model: haiku
    tools: [Read, Grep, Glob, graphify]
    writes: [triage.json]
    skip_if: "kind and size set on the task"

  # ---------- Product ----------
  - id: analyst
    names: [Ana, Oli]
    dept: product
    kind: worker
    reuses: .claude/agents/ecc-code-explorer.md
    model: { default: sonnet, effort: medium }
    max_parallel: 2
    tools: [Read, Grep, Glob, graphify]
    rule_pack: analyst
    writes: [answer.md]

  - id: pm-lead
    name: Paula
    dept: product
    kind: orchestrator
    model: { default: sonnet, effort: medium, L: { model: opus, effort: high } }
    tools: [Read, Grep, Glob, graphify]
    spawns: [scout, legacy-analyst]
    rule_pack: planner
    writes: [spec.md]
    output_cap_lines: 120
    approval: approve-spec

  - id: scout
    names: [Sky, Juno]
    dept: product
    kind: worker
    reuses: .claude/agents/ecc-code-explorer.md
    model: haiku
    max_parallel: 2
    tools: [Read, Grep, Glob, graphify]
    writes: ["findings/scout-{n}.md"]
    output_cap_lines: 40

  - id: legacy-analyst
    name: Lex
    dept: product
    kind: worker
    model: { default: sonnet, effort: low }
    trigger: triage.needs_legacy
    tools: [Read, Grep, Glob, graphify]
    writes: [findings/legacy.md]
    output_cap_lines: 40

  # ---------- Engineering ----------
  - id: tech-lead
    name: Theo
    dept: engineering
    kind: orchestrator
    reuses: .claude/agents/ecc-planner.md
    model: { default: opus, effort: medium, L: { effort: high } }
    tools: [Read, Grep, Glob, graphify]
    spawns: [implementer, contract-specialist]
    rule_pack: planner
    writes: [plan.md]
    output_cap_lines: 80
    fix_rounds: resume_same_implementer

  - id: implementer
    names: [Ivy, Ola, Pip]
    dept: engineering
    kind: worker
    reuses: .claude/agents/wezeo-implementer.md
    model: { default: sonnet, effort: medium, L: { effort: high } }
    max_parallel: 3
    worktree: per_unit
    tools: [Read, Write, Edit, Bash, Grep, Glob]
    bash_allow: ["composer test*", "vendor/bin/pint*", "php -l *", "php deploy/checks/*", "git diff*", "git status*"]
    rule_pack: implementer
    writes: ["impl-{n}.md"]
    output_cap_lines: 40

  - id: contract-specialist
    name: Cora
    dept: engineering
    kind: worker
    reuses: .claude/agents/contract-html.md
    model: { default: sonnet, effort: low }
    trigger: "triage.kind == contract || plan touches apponboarding/onboarding/views/contracts/"
    tools: [Read, Write, Edit, Bash, Grep, Glob]

  # ---------- QA ----------
  - id: primary-reviewer
    name: Rae
    dept: qa
    kind: worker
    reuses: [.claude/agents/wezeo-reviewer.md, .claude/agents/ecc-pr-test-analyzer.md]
    model: { default: sonnet, effort: medium }
    always: true
    tools: [Read, Grep, Glob, Bash]
    rule_pack: reviewer
    writes: [review/primary.json]

  - id: security-reviewer
    name: Sec
    dept: qa
    kind: worker
    reuses: .claude/agents/ecc-security-reviewer.md
    model: { default: sonnet, effort: medium }
    trigger_paths: ["**/routes.php", "**/http/requests/**", "**/http/resources/**", "plugins/widentity/permission/**", "**/middleware/**"]
    tools: [Read, Grep, Glob, Bash]
    rule_pack: security
    writes: [review/security.json]

  - id: failure-hunter
    name: Finn
    dept: qa
    kind: worker
    reuses: .claude/agents/ecc-silent-failure-hunter.md
    model: { default: sonnet, effort: low }
    trigger_paths: ["plugins/appmiddleware/**", "**/*Insyko*", "**/webhook*/**", "**/jobs/**"]
    trigger_diff_regex: "\\bcatch\\s*\\("
    tools: [Read, Grep, Glob, Bash]
    writes: [review/failure.json]

  - id: db-reviewer
    name: Dee
    dept: qa
    kind: worker
    reuses: .claude/agents/ecc-database-reviewer.md   # TODO: October/Laravel tweak, drop Supabase advice
    model: { default: sonnet, effort: low }
    trigger_paths: ["**/updates/**", "**/models/**", "**/repositories/**"]
    tools: [Read, Grep, Glob, Bash]
    writes: [review/db.json]

  - id: qa-lead
    name: Quinn
    dept: qa
    kind: orchestrator
    model: { default: sonnet, effort: low }
    trigger: "reviewers_with_findings >= 2"
    tools: [Read, Grep, Glob]
    writes: [review.json]

  # ---------- Release ----------
  - id: mr-writer
    name: Mira
    dept: release
    kind: worker
    model: haiku
    tools: [Read]
    writes: [mr.md]
    approval: approve-mr

  - id: ci-summarizer
    name: Cid
    dept: release
    kind: worker
    model: haiku
    trigger: "ci-poller sees failed pipeline"
    tools: [Read]
    writes: [ci.json]
    output_cap_lines: 5
